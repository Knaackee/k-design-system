name: k_design_ui
description: Cross-platform Flutter primitives and components for K Design System.
version: 1.0.0-rc.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  k_design_tokens:
    path: ../k_design_tokens
  flutter_svg: ^2.3.0
  http: ^1.6.0
  timezone: 0.11.1
  two_dimensional_scrollables: 0.5.4
  intl: ^0.20.3
  maplibre: 0.3.6
  pointer_interceptor: 0.10.1+3
  flutter_markdown_plus: ^1.0.12
  re_editor: 0.10.0
  re_highlight: 0.0.3
  dicebear_core: 10.7.0
  path_drawing: ^1.0.1
  xml: ^7.0.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/great-icons/
    - assets/dicebear/
    - assets/dicebear/styles/
  shaders:
    - shaders/orbit_center.frag
  fonts:
    - family: KDesignMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
