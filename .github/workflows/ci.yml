name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: dart pub get
      - run: pnpm verify
      # Decision 0010 Web gates. They need the Storybook build and the Flutter
      # measurements that `pnpm verify` produced above, plus Playwright, which
      # is a machine tool rather than a repository dependency.
      - run: npm install -g playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: NODE_PATH="$(npm root -g)" pnpm verify:gates
