name: k_design_flutter_example
description: External-style consumer example for K Design System Flutter packages.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  k_design_tokens:
    path: ../../packages/flutter/k_design_tokens
  k_design_ui:
    path: ../../packages/flutter/k_design_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
