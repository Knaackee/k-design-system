name: k_design_widgetbook
description: Flutter component gallery for K Design System.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  k_design_tokens: any
  k_design_ui: any
  widgetbook: ^3.25.0
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - fixtures/chart-line-reference.json
    - fixtures/chart-families.json
    - fixtures/chart-candlestick.json
    - fixtures/timeline-reference.json
  uses-material-design: true
