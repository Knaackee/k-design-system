name: k_design_widgetbook
description: Flutter component gallery for K Design System.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  k_design_tokens: any
  k_design_ui: any
  widgetbook: ^3.25.0
  flutter_svg: ^2.3.0
  timezone: 0.11.1
  rive: 0.14.11
  audioplayers: 6.8.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  card_stack_widget: 0.1.6
  coverflow_carousel: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/cover-flow/
    - assets/foley/
    - assets/rive/rive-character-v2.riv
    - assets/integrations/
    - fixtures/chart-line-reference.json
    - fixtures/chart-families.json
    - fixtures/chart-candlestick.json
    - fixtures/timeline-reference.json
    - fixtures/gantt-reference.json
  uses-material-design: true
